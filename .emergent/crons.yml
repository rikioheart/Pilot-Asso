crons:
  - name: rappels-quotidiens
    description: "Rappels J-2/J-1 des tâches, activités, événements, publications + bascule des paiements en retard"
    cron: "0 7 * * *"
    timezone: "Europe/Paris"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/reminders"
    method: POST
    enabled: true
  - name: recap-email-bimensuel
    description: "Envoie l'e-mail récapitulatif à l'adresse principale de l'association toutes les 2 semaines"
    cron: "0 9 1,15 * *"
    timezone: "Europe/Paris"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/recap-email"
    method: POST
    enabled: true
  - name: recap-mensuel-adherents
    description: "Envoie chaque 1er du mois le récap d'engagement à chaque adhérent particulier"
    cron: "0 9 1 * *"
    timezone: "Europe/Paris"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/member-recaps"
    method: POST
    enabled: true
  - name: recap-lundi
    description: "Envoie au Bureau le récapitulatif hebdomadaire chaque lundi matin"
    cron: "0 8 * * 1"
    timezone: "Europe/Paris"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-summary"
    method: POST
    enabled: true
  - name: digest-et-vacances-horaire
    description: "Chaque heure : envoie les digests quotidiens à l'heure choisie par chaque membre et clôt les modes vacances arrivés à échéance"
    cron: "0 * * * *"
    timezone: "Europe/Paris"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/hourly"
    method: POST
    enabled: true
